name: Check v2
on:
  push:
    branches: [main]
    paths: ['v2/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build v2
        run: dotnet build v2/Launcher2.csproj -c Release
